<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - THRUST PARFUMS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --dourado: #c9a227; --dourado-claro: #f5d97a; --fundo: #0d0d0d; --card: #1a1a1a; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body { background: var(--fundo); color: #fff; padding: 20px; padding-bottom: 100px; }
  
  /* TELA DE LOGIN */
  .login-box { background: var(--card); padding: 40px 30px; border-radius: 10px; text-align: center; max-width: 400px; margin: 100px auto; border: 1px solid var(--dourado); }
  .login-box h1 { color: var(--dourado-claro); font-family: 'Playfair Display', serif; margin-bottom: 10px; }
  .btn-google { background: #fff; color: #333; border: none; padding: 15px 20px; font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 30px; transition: 0.3s; }
  .btn-google:hover { background: #eee; transform: scale(0.98); }
  
  /* PAINEL */
  #painel { display: none; max-width: 900px; margin: 0 auto; }
  .header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borda); padding-bottom: 15px; margin-bottom: 20px; }
  .header-admin h1 { font-family: 'Playfair Display', serif; color: var(--dourado-claro); font-size: 1.5rem; }
  .btn-sair { background: transparent; border: 1px solid #c94a4a; color: #c94a4a; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .btn-sair:hover { background: #c94a4a; color: #fff; }
  
  /* MENSAGENS */
  .msg { padding: 12px; border-radius: 6px; margin-bottom: 20px; display: none; text-align: center; font-size: 0.9rem; font-weight: bold; }
  .msg.sucesso { background: rgba(37,211,102,0.15); color: #25D366; border: 1px solid #25D366; display: block; }
  .msg.erro { background: rgba(255,0,0,0.15); color: #ff4444; border: 1px solid #ff4444; display: block; }

  /* FORMULÁRIO */
  .form-add { background: var(--card); padding: 25px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #333; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
  .form-add h2 { color: var(--dourado-claro); margin-bottom: 20px; font-size: 1.2rem; font-family: 'Playfair Display', serif; border-bottom: 1px solid var(--borda); padding-bottom: 10px; }
  .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  @media (max-width: 600px) { .grid-inputs { grid-template-columns: 1fr; } }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-family: inherit; font-size: 0.9rem; }
  .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--dourado); }
  
  /* BOX DE TAMANHOS */
  .tamanhos-box { border: 1px dashed #444; padding: 15px; border-radius: 6px; margin-bottom: 20px; background: rgba(255,255,255,0.02); }
  .tamanhos-box h3 { font-size: 0.85rem; color: var(--dourado); margin-bottom: 10px; text-transform: uppercase; }
  .tamanho-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #222; padding: 10px; border-radius: 6px; }
  .tamanho-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--dourado); cursor: pointer; }
  .tamanho-row .label-tam { width: 60px; font-weight: bold; color: #fff; }
  .tamanho-row input[type="number"] { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; }

  .check-top { display: flex; align-items: center; gap: 10px; margin: 20px 0; background: rgba(212,175,55,0.1); border: 1px solid var(--dourado); padding: 12px; border-radius: 6px; cursor: pointer; }
  .check-top input { width: 20px; height: 20px; accent-color: var(--dourado); cursor: pointer; }
  .check-top span { font-weight: bold; color: var(--dourado-claro); }

  .btn-salvar { background: linear-gradient(180deg, var(--dourado-claro), var(--dourado)); color: #0d0d0d; border: none; padding: 16px; width: 100%; font-weight: bold; border-radius: 30px; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
  .btn-salvar:hover { box-shadow: 0 0 20px rgba(212,175,55,0.4); }
  .btn-salvar:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* LISTA DE PERFUMES */
  .lista-admin { background: var(--card); padding: 25px; border-radius: 10px; border: 1px solid #333; }
  .item-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding: 15px 0; gap: 10px; }
  .item-admin:last-child { border-bottom: none; }
  .item-info { display: flex; align-items: center; gap: 15px; flex: 1; }
  .item-info img { width: 50px; height: 50px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px; }
  .item-info .nome { color: var(--dourado-claro); font-weight: bold; font-size: 1rem; }
  .item-info .detalhes { color: #888; font-size: 0.75rem; }
  .btn-excluir { background: transparent; border: 1px solid #c94a4a; color: #c94a4a; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.2s; }
  .btn-excluir:hover { background: #c94a4a; color: white; }
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-box" id="tela-login">
  <h1>Painel THRUST</h1>
  <p style="color:#888; font-size:0.9rem;">Acesso restrito ao administrador.</p>
  <button class="btn-google" id="btn-google">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24">
    Entrar com o Google
  </button>
</div>

<!-- PAINEL DE ADMIN -->
<div id="painel">
  <div class="header-admin">
    <h1>Gerenciar Catálogo</h1>
    <button class="btn-sair" id="btn-sair">Sair</button>
  </div>

  <div class="msg" id="mensagem"></div>

  <div class="form-add">
    <h2>Adicionar Novo Perfume</h2>
    <form id="form-perfume">
      
      <div class="grid-inputs">
        <div class="input-group">
          <label>Nome do Perfume (THRUST)</label>
          <input type="text" id="nome" required placeholder="Ex: Femme Fatale">
        </div>
        <div class="input-group">
          <label>Inspirado em (Original)</label>
          <input type="text" id="insp" required placeholder="Ex: Good Girl">
        </div>
      </div>

      <div class="grid-inputs">
        <div class="input-group">
          <label>Categoria</label>
          <select id="cat">
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="compartilhado">Compartilhado</option>
          </select>
        </div>
        <div class="input-group">
          <label>Link da Imagem (ImgBB)</label>
          <input type="url" id="img" placeholder="https://i.ibb.co/...">
        </div>
      </div>

      <div class="tamanhos-box">
        <h3>Tamanhos e Preços</h3>
        <div class="tamanho-row">
          <input type="checkbox" id="chk-30">
          <span class="label-tam">30ml</span>
          <input type="number" step="0.01" id="preco-30" placeholder="Preço ex: 59.90">
        </div>
        <div class="tamanho-row">
          <input type="checkbox" id="chk-50" checked>
          <span class="label-tam">50ml</span>
          <input type="number" step="0.01" id="preco-50" placeholder="Preço ex: 79.90">
        </div>
        <div class="tamanho-row">
          <input type="checkbox" id="chk-100">
          <span class="label-tam">100ml</span>
          <input type="number" step="0.01" id="preco-100" placeholder="Preço ex: 139.90">
        </div>
      </div>

      <label class="check-top">
        <input type="checkbox" id="vendido">
        <span>Marcar como "Mais Vendido" (Selo TOP)</span>
      </label>

      <div class="input-group">
        <label>Sobre a fragrância (Descrição)</label>
        <textarea id="desc" rows="3" placeholder="Ex: Uma fragrância âmbar floral sensual..."></textarea>
      </div>

      <div class="grid-inputs">
        <div class="input-group">
          <label>Notas de Topo</label>
          <input type="text" id="topo" placeholder="Ex: Amêndoa, Café">
        </div>
        <div class="input-group">
          <label>Notas de Coração</label>
          <input type="text" id="coracao" placeholder="Ex: Jasmim, Tuberosa">
        </div>
      </div>
      <div class="input-group">
        <label>Notas de Fundo</label>
        <input type="text" id="fundo" placeholder="Ex: Baunilha, Cacau">
      </div>

      <button type="submit" class="btn-salvar" id="btn-submit">Salvar Perfume no Catálogo</button>
    </form>
  </div>

  <div class="lista-admin">
    <h2 style="color:var(--dourado-claro); margin-bottom:20px; font-family:'Playfair Display', serif;">Perfumes no Catálogo</h2>
    <div id="lista-perfumes-admin"></div>
  </div>
</div>

<!-- LÓGICA FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCtdszBtbQiaZnWcLLKBPnwo_3yHRtp2mA",
    authDomain: "thrustperfumes.firebaseapp.com",
    projectId: "thrustperfumes",
    storageBucket: "thrustperfumes.firebasestorage.app",
    messagingSenderId: "772745912522",
    appId: "1:772745912522:web:efaa2b56877dc4b880d433"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ⚠️ COLOQUE O SEU E-MAIL DO GOOGLE AQUI PARA BLOQUEAR OUTROS USUÁRIOS
  const ADMIN_EMAIL = "ewerton.andriel@gmail.com"; 

  const telaLogin = document.getElementById('tela-login');
  const painel = document.getElementById('painel');
  const btnGoogle = document.getElementById('btn-google');
  const btnSair = document.getElementById('btn-sair');
  const listaAdmin = document.getElementById('lista-perfumes-admin');
  const formPerfume = document.getElementById('form-perfume');
  const msgDiv = document.getElementById('mensagem');
  const btnSubmit = document.getElementById('btn-submit');

  // Login / Logout
  btnGoogle.addEventListener('click', () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider).catch(err => alert("Erro ao logar: " + err.message));
  });
  btnSair.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if (user.email === ADMIN_EMAIL) {
        telaLogin.style.display = 'none';
        painel.style.display = 'block';
        carregarListaAdmin();
      } else {
        alert("Acesso negado. E-mail não autorizado.");
        signOut(auth);
      }
    } else {
      telaLogin.style.display = 'block';
      painel.style.display = 'none';
    }
  });

  // Adicionar Perfume
  formPerfume.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSubmit.innerText = "Salvando...";
    btnSubmit.disabled = true;

    // Coleta os tamanhos marcados
    const tamanhos = {};
    if(document.getElementById('chk-30').checked) tamanhos["30ml"] = parseFloat(document.getElementById('preco-30').value) || 0;
    if(document.getElementById('chk-50').checked) tamanhos["50ml"] = parseFloat(document.getElementById('preco-50').value) || 0;
    if(document.getElementById('chk-100').checked) tamanhos["100ml"] = parseFloat(document.getElementById('preco-100').value) || 0;

    try {
      await addDoc(collection(db, "perfumes"), {
        nome: document.getElementById('nome').value,
        insp: document.getElementById('insp').value,
        cat: document.getElementById('cat').value,
        img: document.getElementById('img').value || "COLE_O_LINK_AQUI",
        tamanhos: tamanhos,
        vendido: document.getElementById('vendido').checked,
        desc: document.getElementById('desc').value,
        notas: {
          topo: document.getElementById('topo').value,
          coracao: document.getElementById('coracao').value,
          fundo: document.getElementById('fundo').value
        },
        criadoEm: new Date()
      });
      
      mostrarMsg("Perfume cadastrado com sucesso!", "sucesso");
      formPerfume.reset();
      document.getElementById('chk-50').checked = true; // Reseta o padrão
    } catch (error) {
      console.error(error);
      mostrarMsg("Erro ao cadastrar: " + error.message, "erro");
    } finally {
      btnSubmit.innerText = "Salvar Perfume no Catálogo";
      btnSubmit.disabled = false;
    }
  });

  // Listar Perfumes no Admin
  function carregarListaAdmin() {
    const q = query(collection(db, "perfumes"), orderBy("nome"));
    onSnapshot(q, (snapshot) => {
      listaAdmin.innerHTML = '';
      if (snapshot.empty) {
        listaAdmin.innerHTML = '<p style="color:#666;">Nenhum perfume cadastrado.</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const p = docSnap.data();
        const id = docSnap.id;
        
        // Descobre qual é o preço principal para mostrar (50ml ou o primeiro que achar)
        let precoExibir = "Preço indisponível";
        if(p.tamanhos) {
          if(p.tamanhos["50ml"]) precoExibir = `R$ ${p.tamanhos["50ml"].toFixed(2)} (50ml)`;
          else {
            const keys = Object.keys(p.tamanhos);
            if(keys.length > 0) precoExibir = `R$ ${p.tamanhos[keys[0]].toFixed(2)} (${keys[0]})`;
          }
        }

        const div = document.createElement('div');
        div.className = 'item-admin';
        div.innerHTML = `
          <div class="item-info">
            <img src="${p.img !== 'COLE_O_LINK_AQUI' ? p.img : 'https://via.placeholder.com/50'}" alt="">
            <div>
              <div class="nome">${p.nome} ${p.vendido ? '🔥' : ''}</div>
              <div class="detalhes">Insp: ${p.insp} | ${precoExibir}</div>
            </div>
          </div>
          <button class="btn-excluir" data-id="${id}">Excluir</button>
        `;
        listaAdmin.appendChild(div);
      });

      // Botões de Excluir
      document.querySelectorAll('.btn-excluir').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (confirm("Tem certeza que deseja excluir este perfume do catálogo?")) {
            const id = e.target.getAttribute('data-id');
            await deleteDoc(doc(db, "perfumes", id));
            mostrarMsg("Perfume excluído!", "sucesso");
          }
        });
      });
    });
  }

  function mostrarMsg(texto, tipo) {
    msgDiv.innerText = texto;
    msgDiv.className = `msg ${tipo}`;
    setTimeout(() => { msgDiv.className = 'msg'; }, 3000);
  }
</script>

</body>
</html>
